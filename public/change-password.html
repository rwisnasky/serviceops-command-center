<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change password — ServiceOps Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
    .login-card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-xl); padding: 36px 32px 28px; box-shadow: var(--shadow-lg); }
    .login-brand { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.5px; }
    .login-brand .s { color: var(--accent); }
    .login-sub { color: var(--muted); font-size: 12px; margin-bottom: 28px; }
    .login-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .login-hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .forced-banner { background: rgba(232,168,56,0.10); border: 1px solid rgba(232,168,56,0.45); color: #f6d28b; font-size: 12px; padding: 10px 12px; border-radius: var(--r-sm); margin-bottom: 14px; display: none; }
    .forced-banner.show { display: block; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 14px 0 6px; }
    input[type=password] { width: 100%; background: var(--surface2); border: 1px solid var(--border-strong); border-radius: var(--r-md); color: var(--text); font-size: 14px; padding: 11px 13px; outline: none; transition: border-color .15s, box-shadow .15s; font-family: var(--font-sans); }
    input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    button.login-submit { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: var(--r-md); background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-red); font-family: var(--font-sans); }
    button.login-submit[disabled] { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 10px 12px; border-radius: var(--r-sm); font-size: 13px; display: none; }
    .msg.show { display: block; }
    .msg.err { background: rgba(239,68,85,0.10); border: 1px solid rgba(239,68,85,0.45); color: #ffb3bb; }
    .msg.ok { background: rgba(63,174,106,0.10); border: 1px solid rgba(63,174,106,0.45); color: #b1e9c5; }
    .login-foot { margin-top: 22px; text-align: center; font-size: 11px; }
    .login-foot a { color: var(--accent3); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="cp-form">
      <div class="login-brand"><span class="s">SERVICE</span>OPS</div>
      <div class="login-sub">Command Center</div>

      <div class="login-title">Change password</div>
      <div class="login-hint" id="hint">Choose a new password (8+ characters).</div>

      <div class="forced-banner" id="forced-banner">
        First sign-in detected — please rotate the seeded password before continuing.
      </div>

      <label for="cur">Current password</label>
      <input id="cur" type="password" autocomplete="current-password" required />

      <label for="np1">New password</label>
      <input id="np1" type="password" autocomplete="new-password" minlength="8" required />

      <label for="np2">Confirm new password</label>
      <input id="np2" type="password" autocomplete="new-password" minlength="8" required />

      <button type="submit" class="login-submit" id="submit-btn">Update password</button>

      <div class="msg err" id="err"></div>
      <div class="msg ok" id="ok"></div>

      <div class="login-foot">
        <a href="/">← Back to dashboard</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('cp-form');
    const errEl = document.getElementById('err');
    const okEl = document.getElementById('ok');
    const btn = document.getElementById('submit-btn');

    if (new URLSearchParams(window.location.search).get('forced') === '1') {
      document.getElementById('forced-banner').classList.add('show');
    }

    function show(el, msg) { el.textContent = msg; el.classList.add('show'); }
    function hide(el) { el.classList.remove('show'); el.textContent = ''; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hide(errEl); hide(okEl);
      const cur = document.getElementById('cur').value;
      const np1 = document.getElementById('np1').value;
      const np2 = document.getElementById('np2').value;
      if (np1 !== np2) return show(errEl, 'New passwords do not match.');
      if (np1.length < 8) return show(errEl, 'New password must be at least 8 characters.');
      if (np1 === cur) return show(errEl, 'New password must be different from current password.');

      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: cur, newPassword: np1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          show(errEl, data.error || 'Update failed.');
          btn.disabled = false; btn.textContent = 'Update password';
          return;
        }
        show(okEl, 'Password updated. Redirecting…');
        setTimeout(() => { window.location.href = '/'; }, 900);
      } catch (err) {
        show(errEl, err.message || 'Network error.');
        btn.disabled = false; btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
